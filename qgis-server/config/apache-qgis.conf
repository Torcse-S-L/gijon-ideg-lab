ServerName ideg-qgis-server

<VirtualHost *:80>
    ServerName localhost
    ServerAlias ideg.gijon.es

    DocumentRoot /var/www/html

    # ── QGIS Server (FastCGI) ────────────────────────────────────────────────
    FcgidInitialEnv QGIS_SERVER_LOG_LEVEL    1
    FcgidInitialEnv QGIS_SERVER_MAX_THREADS  4
    FcgidInitialEnv QGIS_PLUGINPATH          /usr/lib/qgis/plugins
    FcgidInitialEnv GDAL_SKIP                ECW
    FcgidInitialEnv PYTHONPATH               /usr/share/qgis/python:/usr/lib/python3/dist-packages

    # Proyectos QGIS almacenados en PostgreSQL o sistema de ficheros
    FcgidInitialEnv QGIS_SERVER_PROJECTS_DIR /etc/qgisserver/projects

    ScriptAlias /qgis/ /usr/lib/cgi-bin/

    <Directory /usr/lib/cgi-bin>
        Options +ExecCGI
        AllowOverride None
        Require all granted
        AddHandler fcgid-script .fcgi
    </Directory>

    # ── WMS/WFS público (sin autenticación) ──────────────────────────────────
    <LocationMatch "^/qgis/qgis_mapserv.fcgi">
        Order allow,deny
        Allow from all
        SetEnvIf Request_URI "^/qgis/qgis_mapserv.fcgi" QGIS_PROJECT_FILE=/etc/qgisserver/projects/ideg_publico.qgs
    </LocationMatch>

    # ── WMS/WFS interno (requiere autenticación básica) ───────────────────────
    <Location /qgis-interno/>
        AuthType Basic
        AuthName "IDEG — Acceso Interno Municipal"
        AuthUserFile /etc/apache2/htpasswd_ideg
        Require valid-user
        SetEnv QGIS_PROJECT_FILE /etc/qgisserver/projects/ideg_interno.qgs
    </Location>

    # ── Logs ─────────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/qgis_error.log
    CustomLog ${APACHE_LOG_DIR}/qgis_access.log combined
</VirtualHost>
